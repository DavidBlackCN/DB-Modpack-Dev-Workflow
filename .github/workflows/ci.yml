name: CI
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A same-repository PR and its branch push share a group; newer runs replace older ones.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_targets: ${{ steps.plan.outputs.has_targets }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: node tools/ci.mjs plan
      - name: Commitlint
        env:
          COMMIT_BASE: ${{ steps.plan.outputs.base }}
          COMMIT_HEAD: ${{ steps.plan.outputs.head }}
        run: node tools/ci.mjs lint
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21.0.10+7
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run mp -- bootstrap
      - run: pnpm run mp -- check --all
      - name: Ensure source unchanged
        run: node tools/ci.mjs clean
  build:
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21.0.10+7
      - run: pnpm install --frozen-lockfile
      - run: pnpm run mp -- bootstrap
      - name: Build in isolated copy (no update/sync)
        id: build
        env:
          TARGET_ID: ${{ matrix.target }}
        run: node tools/ci.mjs build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-${{ matrix.target }}
          path: ${{ steps.build.outputs.output }}/*
          if-no-files-found: error
          retention-days: 14
  required:
    name: Required checks
    if: always()
    needs: [plan, test, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate every required result
        env:
          PLAN: ${{ needs.plan.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          HAS_TARGETS: ${{ needs.plan.outputs.has_targets }}
        run: |
          test "$PLAN" = success
          test "$TEST" = success
          if [ "$HAS_TARGETS" = true ]; then test "$BUILD" = success; else test "$BUILD" = skipped; fi
