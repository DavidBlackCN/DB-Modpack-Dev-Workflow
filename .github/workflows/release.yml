name: Draft Release
on:
  push:
    tags: ['release/*/v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.10+7.0.LTS'
      - run: pnpm install --frozen-lockfile
      - id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/ci.mjs tag
      - run: pnpm test
      - run: pnpm run mp -- bootstrap
      - run: pnpm run mp -- check --all
      - id: build
        env:
          TARGET_ID: ${{ steps.tag.outputs.target }}
        run: node tools/ci.mjs build
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: ${{ steps.build.outputs.output }}/*
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: .work/release
      - name: Create draft only; never overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_DIRECTORY: .work/release
        run: node tools/release.mjs --publish
